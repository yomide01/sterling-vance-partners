name: Daily company cycle

on:
  schedule:
    - cron: '15 5 * * *'   # every day 05:15 UTC (06:15 Lagos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (nothing publishes if these fail)
        run: python -m unittest discover -s tests -v
      - name: Run the company for today
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          PRICE: ${{ secrets.PRICE }}
          CURRENCY: ${{ secrets.CURRENCY }}
        run: python -m company.cycle
      - name: Publish new pages (Render redeploys automatically)
        run: |
          git config user.name "sterling-vance-ai"
          git config user.email "noreply@users.noreply.github.com"
          git add public data/reports data/rejected
          git diff --cached --quiet || (git commit -m "daily cycle: new guides and indexes" && git push)
