name: Deploy to Render (one-time setup, safe to re-run)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create or update the Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          PRICE: ${{ secrets.PRICE }}
          CURRENCY: ${{ secrets.CURRENCY }}
        run: python scripts/render_deploy.py
