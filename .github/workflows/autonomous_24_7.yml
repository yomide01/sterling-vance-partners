name: Sterling & Vance 24/7 Autonomous Swarm & Pages Deploy

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour 24/7/365 in the cloud even when laptop is off
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  autonomous-cycle-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Autonomous US/EU Build & Sitemap Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTREACH_SENDER_EMAIL: ${{ secrets.OUTREACH_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          python -c "
          from engine.database import init_db
          from engine.autonomous_swarm import swarm_engine, US_EU_SMB_DISCOVERY_STREAM
          init_db()
          for seed in US_EU_SMB_DISCOVERY_STREAM:
              swarm_engine._execute_single_prospect_pipeline(seed, fast_boot=True)
          print('24/7 Cloud Cycle Completed Successfully.')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Public Portal & Client Workspaces to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
