services:
  - type: web
    name: sterling-vance
    runtime: python
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "python app.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRICE
        value: "15000"
      - key: CURRENCY
        value: NGN
